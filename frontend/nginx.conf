server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://two36102-vanthaitoan-2.onrender.com/api/;
        proxy_ssl_server_name on;
    }
}