services:
  backend:
    build:
      context: ./backend
    container_name: food-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: food-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - backend
