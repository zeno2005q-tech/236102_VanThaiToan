name: Docker CI/CD Pipeline - MSSV 236102

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn mới nhất từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập Docker Hub bằng Secret
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Tự động Build và Push Image Backend
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: zeno2005q/backend:latest

      # 4. Tự động Build và Push Image Frontend
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: zeno2005q/frontend:latest